<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DS LAB - Data Science Laboratory Portal for Modules and Lab Execution">
  <title>{% block title %}DS LAB | Data Science Laboratory{% endblock %}</title>
  
  <!-- Google Fonts: Sora & IBM Plex Sans (matches reference design) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo.svg') }}">
</head>
<body>

  <!-- Site Header -->
  <header class="dsl-header">
    <div class="dsl-header__inner">
      <!-- Left side: Brand Logo + Primary Navigation with Symbols -->
      <div class="dsl-header__left">
        <a href="{{ url_for('home') }}" class="dsl-brand" aria-label="DS LAB Home">
          <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="DS Lab Logo" class="dsl-logo">
          <div class="dsl-brand__text">
            <span class="dsl-brand__title">DS LAB</span>
            <span class="dsl-brand__subtitle">Data Science Laboratory</span>
          </div>
        </a>

        <!-- Main Navigation with Home, Book, and Code symbols placed to the left -->
        <nav class="dsl-nav" id="dslNav" aria-label="Primary Navigation">
          <a href="{{ url_for('home') }}" class="dsl-nav__item {% if request.endpoint == 'home' %}is-active{% endif %}">
            <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
              <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
            <span>Home</span>
          </a>
          <a href="{{ url_for('modules_page') }}" class="dsl-nav__item {% if request.endpoint in ['modules_page', 'module_details_page'] %}is-active{% endif %}">
            <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
              <path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4zm12 16H6v-2h12v2zm0-4H6v-2h12v2zm0-4h-5V4h5v8z"/>
            </svg>
            <span>Modules</span>
          </a>
          <a href="{{ url_for('lab_execution_page') }}" class="dsl-nav__item {% if request.endpoint in ['lab_execution_page', 'experiment_details_page'] %}is-active{% endif %}">
            <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
              <path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/>
            </svg>
            <span>Lab Execution</span>
          </a>
        </nav>
      </div>

      <!-- Right Actions: Student Profile -->
      <div class="dsl-header__right">
        <button type="button" class="dsl-profile-pill" data-open-profile title="Click to view and edit student profile">
          <img src="{{ current_student.photo_url or url_for('static', filename='images/default_student.svg') }}" alt="Student Avatar" class="dsl-profile-avatar">
          <span class="dsl-profile-name">{{ current_student.name or 'Student' }}</span>
        </button>

        <button type="button" class="dsl-burger" id="dslBurger" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
      </div>
    </div>
  </header>

  <!-- Main Content Block -->
  <main class="site-main">
    {% block content %}{% endblock %}
  </main>

  <!-- Edit ID Card / Student Profile Modal -->
  <div class="modal-overlay" id="profileModal" role="dialog" aria-modal="true" aria-labelledby="profileModalHeading">
    <div class="modal-panel">
      <div class="modal-header">
        <h2 id="profileModalHeading" style="font-size: 1.25rem;">Edit Student Profile / ID Card</h2>
        <button type="button" class="modal-close" data-close-modal aria-label="Close modal">&times;</button>
      </div>

      <form id="profileForm" novalidate>
        <!-- Photo Selection -->
        <div class="form-group" style="text-align: center; margin-bottom: 12px;">
          <div style="display: flex; align-items: center; justify-content: center; gap: 16px;">
            <img id="profilePhotoPreview" src="{{ current_student.photo_url or url_for('static', filename='images/default_student.svg') }}" alt="Profile preview" style="width: 70px; height: 86px; border-radius: 8px; border: 1px solid var(--line); object-fit: cover;">
            <label class="btn btn--ghost btn--sm" for="profilePhotoInput" style="cursor: pointer;">
              Choose Photo
              <input type="file" id="profilePhotoInput" accept="image/*" style="display: none;">
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="profName">Student Name</label>
          <input type="text" id="profName" maxlength="60" value="{{ current_student.name }}" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="profRegister">Register / Roll Number</label>
            <input type="text" id="profRegister" maxlength="30" value="{{ current_student.register_no }}" required>
          </div>
          <div class="form-group">
            <label for="profSection">Section</label>
            <input type="text" id="profSection" maxlength="15" value="{{ current_student.section }}" required>
          </div>
        </div>

        <div class="form-group">
          <label for="profBranch">Branch / Department</label>
          <input type="text" id="profBranch" maxlength="60" value="{{ current_student.branch }}" required>
        </div>

        <div class="form-group">
          <label for="profFaculty">Faculty / Assistant Professor</label>
          <input type="text" id="profFaculty" maxlength="80" value="{{ current_student.faculty_name }}" placeholder="Dr. S. Ramanathan">
        </div>

        <div class="form-group">
          <label for="profGithub">GitHub Profile / Repository Link</label>
          <input type="url" id="profGithub" value="{{ current_student.github_url }}" placeholder="https://github.com/username/project">
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn--ghost" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn--primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="dsl-footer">
    <div class="dsl-footer__inner">
      <div>
        <strong>DS LAB</strong> | Data Science Laboratory Portal &copy; 2026
      </div>
      <div>
        Academic Curriculum &middot; Practical Lab Execution &middot; Learning Resources
      </div>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
